services:
  duckdb:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set in .env or via fnox}@postgres:5432/${POSTGRES_DB:-postgres}
      QUACK_TOKEN: ${QUACK_TOKEN:?set in .env or via fnox}
    ports:
      - "127.0.0.1:9494:9494"
    volumes:
      - duckdata:/data

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env or via fnox}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  duckdata:
  pgdata:
